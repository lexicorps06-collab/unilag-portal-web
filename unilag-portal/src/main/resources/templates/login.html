<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log In | UNILAG Student Portal</title>
    <link rel="stylesheet" href="C:\Users\SULTAN\Downloads\unilag-portal\src\main\resources\static\css\style.css">
</head>

<body>

    ```
    <div class="unilag-login-page">

        <div class="login-content">

            <h1>LOG IN</h1>

            <div class="error-banner" th:if="${error}" th:text="${error}">
            </div>

            <div class="signed-out-message" th:if="${param.loggedOut}">
                You've been signed out successfully.
            </div>

            <form th:action="@{/login}" method="post">

                <div class="form-group">

                    <label for="matricNo">
                        Matric/Application number
                    </label>

                    <input type="text" id="matricNo" name="matricNo" placeholder="Matric/Application number"
                        th:value="${matricNo}" required autofocus>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input type="password" id="password" name="password" placeholder="••••••••••••" required>

                </div>


                <div class="forgot-password">

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <button type="submit">
                    SIGN IN
                </button>

            </form>

        </div>

    </div>
    ```

</body>

</html>
